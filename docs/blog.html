<html lang="en">
<head>

    <link rel="canonical" href="https://mikebeaumier.com/blog/series/bluegrass-book-dev-log/">
    <script>
        // The dev blog lives on mikebeaumier.com now. Old post links were
        // blog.html#<slug>, and the new posts keep those slugs. The fragment

        var POSTS = [
            '2025-12-28-hello-world',
            '2025-12-28-what-did-i-build-here-anyway',
            '2025-12-31-new-feature-drops',
            '2026-01-03-new-year-new-features',

            '2026-01-10-chords',
            '2026-01-10-week-of-polish',
            '2026-07-26-two-point-oh'
        ];
        var slug = location.hash.slice(1);
        location.replace(POSTS.indexOf(slug) >= 0
            ? 'https://mikebeaumier.com/blog/' + slug + '/'
            : 'https://mikebeaumier.com/blog/series/bluegrass-book-dev-log/');
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=https://mikebeaumier.com/blog/series/bluegrass-book-dev-log/"></noscript>
</head>
