<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a Tab — Bluegrass Book</title>
    <style>
        /* Theme tokens mirror docs/css/style.css (this page is standalone —
           it doesn't load the app shell — so the names and values are
           repeated, never re-invented). --bg-hover / --text-muted /
           --border-hover / --accent-transparent are the fallbacks the OTF
           editor's own injected styles reach for. */
        :root {
            /* Tells the UA which palette its own widgets belong to. Without
               it a <button> keeps `color: buttontext` (black) in dark mode,
               which is how the editor's ▶/⏹ went black-on-black. */
            color-scheme: light;
            --bg: #fafafa;
            --bg-secondary: #f7f7f7;
            --bg-hover: #ededed;
            --text: #000000;
            --text-secondary: #666666;
            --text-muted: #666666;
            --border: #e0e0e0;
            --border-hover: #cccccc;
            --accent: #2563eb;
            --accent-transparent: rgba(37, 99, 235, 0.25);
            --danger: #dc2626;
            --warning: #fd7e14;
        }
        [data-theme="dark"] {
            color-scheme: dark;
            --bg: #000000;
            --bg-secondary: #111111;
            --bg-hover: #1d1d1d;
            --text: #ffffff;
            --text-secondary: #999999;
            --text-muted: #999999;
            --border: #333333;
            --border-hover: #4d4d4d;
            --accent: #60a5fa;
            --accent-transparent: rgba(96, 165, 250, 0.25);
            --danger: #f87171;
        }

        /* Page shell: a flex column so the editor can be handed a DEFINITE
           height (see body.editor-open below). Without one, the tab's
           scroll region has no bottom and grows the page instead. */
        html { height: 100%; }
        body { font-family: system-ui, sans-serif; margin: 0;
               background: var(--bg); color: var(--text);
               min-height: 100vh; min-height: 100dvh;
               display: flex; flex-direction: column; }
        header { padding: 12px 20px; border-bottom: 1px solid var(--border);
                 display: flex; align-items: center; gap: 16px; flex: 0 0 auto; }
        header a { color: var(--accent); text-decoration: none; }
        h1 { font-size: 18px; margin: 0; }
        main { padding: 20px; flex: 1 1 auto; min-height: 0; }
        .create-form { max-width: 560px; display: grid; gap: 14px; }
        .create-form label { display: grid; gap: 4px; font-size: 14px; }
        .create-form input, .create-form select { padding: 6px 8px; font-size: 14px; }
        .instruments { display: grid; gap: 6px; border: 1px solid var(--border);
                       border-radius: 6px; padding: 10px; }
        .instruments label { display: flex; gap: 8px; align-items: center; font-size: 14px; }
        .row { display: flex; gap: 12px; }
        .row label { flex: 1; }
        button.primary { padding: 10px 18px; font-size: 15px; background: var(--accent);
                         color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
        .draft-banner { background: var(--bg-secondary); border: 1px solid var(--border);
                        border-left: 3px solid var(--warning); padding: 10px 14px;
                        border-radius: 6px; margin-bottom: 16px; display: flex;
                        gap: 12px; align-items: center; max-width: 560px; }
        .editor-bar { display: flex; justify-content: space-between; align-items: center;
                      margin-bottom: 10px; gap: 12px; flex-wrap: wrap; }
        #editor-host { min-height: 400px; }
        .import-zone { max-width: 560px; border: 2px dashed var(--border);
                       border-radius: 8px; padding: 22px 18px; margin-bottom: 18px;
                       text-align: center; cursor: pointer; transition: border-color .15s, background .15s; }
        .import-zone:hover, .import-zone.dragover { border-color: var(--accent);
                       background: var(--bg-secondary); }
        .import-zone strong { display: block; font-size: 15px; margin-bottom: 4px; }
        .import-zone .hint { font-size: 13px; color: var(--text-muted); }
        .import-error { color: var(--danger); font-size: 13px; margin-top: 8px; }
        .or-sep { max-width: 560px; text-align: center; color: var(--text-muted);
                  font-size: 13px; margin: 4px 0 14px; }
        .target-banner { background: var(--bg-secondary); border: 1px solid var(--border);
                         border-left: 3px solid var(--accent); padding: 10px 14px;
                         border-radius: 6px; margin-bottom: 16px; max-width: 560px;
                         font-size: 14px; }
        .target-banner a { color: var(--accent); }
        .target-banner strong { font-weight: 600; }
        .hidden { display: none !important; }

        /* ── Editing: fixed chrome, scrolling tab ────────────────────────
           The window is the frame. Header + title row pin to the top, the
           editor's toolbar and transport pin to the bottom (editor.js's
           fill mode), and the ONLY thing that scrolls is the tablature in
           between. Nothing here may let the document scroll: that is what
           used to carry the toolbar off the screen.
           dvh over vh so mobile Safari's collapsing URL bar doesn't leave
           the bottom controls under the browser chrome. */
        html.editor-open { height: 100%; overflow: hidden; }
        body.editor-open { height: 100vh; height: 100dvh; overflow: hidden; }
        body.editor-open main {
            padding: 0; min-height: 0;
            display: flex; flex-direction: column; overflow: hidden;
        }
        body.editor-open #target-banner { flex: 0 0 auto; margin: 10px 12px 0; }
        body.editor-open #editor-wrap {
            flex: 1 1 auto; min-height: 0;
            display: flex; flex-direction: column;
        }
        body.editor-open .editor-bar {
            flex: 0 0 auto; margin: 0;
            padding: 8px 12px; border-bottom: 1px solid var(--border);
        }
        /* The one flexible track: everything else is fixed-size chrome */
        body.editor-open #editor-host { flex: 1 1 0; min-height: 0; }

        @media (max-width: 640px) {
            body.editor-open header { padding: 8px 12px; }
            body.editor-open h1 { font-size: 16px; }
        }
    </style>
    <script>
        // Follow the app's theme (docs/js/main.js writes localStorage.theme).
        // Inline + synchronous so the page never flashes light first.
        try {
            if (localStorage.getItem('theme') === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        } catch (e) { /* storage blocked — light theme is a fine default */ }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header>
        <h1>Create a Tab</h1>
        <a href="index.html">← Bluegrass Book</a>
    </header>
    <main>
        <!-- Targeted mode: this tab belongs to a work that already exists
             (a bounty on its page, or the add-song picker) -->
        <div id="target-banner" class="target-banner hidden"></div>
        <div id="draft-banner" class="draft-banner hidden">
            <span>You have an unsaved draft (<span id="draft-when"></span>).</span>
            <button id="draft-resume">Resume</button>
            <button id="draft-discard">Discard</button>
        </div>

        <div id="import-zone" class="import-zone" tabindex="0" role="button"
             aria-label="Import a TablEdit .tef file">
            <strong>📂 Import a TablEdit tab (.tef)</strong>
            <span class="hint">Drop a <code>.tef</code> file here, or click to choose one —
                it opens in the editor, ready to review and submit.</span>
            <input id="import-file" type="file" accept=".tef" class="hidden">
            <div id="import-error" class="import-error hidden"></div>
        </div>
        <div class="or-sep">— or start a new tab from scratch —</div>

        <form id="create-form" class="create-form">
            <label>Title
                <input id="f-title" type="text" placeholder="Untitled" autofocus>
            </label>
            <div class="instruments" id="f-instruments"></div>
            <div class="row">
                <label>Time signature
                    <select id="f-ts">
                        <option>4/4</option><option>3/4</option><option>2/4</option>
                        <option>2/2</option><option>6/8</option>
                    </select>
                </label>
                <label>Tempo (BPM)
                    <input id="f-tempo" type="number" value="120" min="40" max="280">
                </label>
                <label>Measures
                    <input id="f-measures" type="number" value="16" min="1" max="128">
                </label>
            </div>
            <button type="submit" class="primary">Create tab</button>
        </form>

        <div id="editor-wrap" class="hidden">
            <div class="editor-bar">
                <strong id="editor-title"></strong>
                <span>
                    <button id="btn-submit">🚀 Submit tab</button>
                    <button id="btn-download">⬇ Download OTF</button>
                    <button id="btn-new">Start over</button>
                    <span id="submit-status"></span>
                </span>
            </div>
            <div id="editor-host"></div>
        </div>
    </main>

    <script src="js/supabase-auth.js"></script>
    <script type="module">
        import { OTFEditor } from './js/otf-editor/editor.js';
        import {
            INSTRUMENT_CHOICES, buildNewTab,
            saveDraft, loadDraft, clearDraft,
        } from './js/otf-editor/create-tab.js';
        import {
            parseCreateTarget, presetForInstrument, submitNewTab, targetBannerText,
        } from './js/otf-editor/create-tab-entry.js';
        import { parseTef, TefVersionError } from './js/tef-import/index.js';

        // Auth is needed for Submit (Phase 2a) — the session IS the
        // attribution. Without this the page could edit but never submit.
        window.SupabaseAuth?.init();

        const $ = (id) => document.getElementById(id);

        // Where this tab is headed: an existing work (from a bounty or the
        // add-song picker) or nowhere in particular (a brand-new work).
        let target = parseCreateTarget(window.location.search);

        function applyTarget() {
            if (!target?.workId) return;
            const banner = $('target-banner');
            banner.textContent = '';
            banner.append('Adding a tab to ');
            const link = document.createElement('a');
            link.href = `index.html#work/${target.workId}`;
            link.textContent = target.title || target.workId;
            banner.append(link);
            if (target.instrument) {
                const strong = document.createElement('strong');
                strong.textContent = ` — ${target.instrument}`;
                banner.append(strong);
            }
            banner.append('. ');
            banner.append(targetBannerText(target));
            banner.classList.remove('hidden');
            if (target.title && !$('f-title').value) $('f-title').value = target.title;
        }

        // Instrument checkboxes
        const preselect = target.instrument ? presetForInstrument(target.instrument) : null;
        for (const [i, inst] of INSTRUMENT_CHOICES.entries()) {
            const label = document.createElement('label');
            const checked = preselect ? inst.value === preselect : i === 0;
            label.innerHTML = `<input type="checkbox" value="${inst.value}"
                ${checked ? 'checked' : ''}> ${inst.label}`;
            $('f-instruments').appendChild(label);
        }
        applyTarget();

        let editor = null;

        // Editing takes over the viewport: the page stops scrolling so the
        // header/title row stay pinned up top and the editor's own toolbar
        // and transport stay pinned at the bottom. Both elements carry the
        // class — <html> too, or iOS still rubber-bands the document.
        function setEditingLayout(on) {
            document.documentElement.classList.toggle('editor-open', on);
            document.body.classList.toggle('editor-open', on);
        }

        function openEditor(otf) {
            $('create-form').classList.add('hidden');
            $('draft-banner').classList.add('hidden');
            $('import-zone').classList.add('hidden');
            document.querySelector('.or-sep')?.classList.add('hidden');
            $('editor-wrap').classList.remove('hidden');
            $('editor-title').textContent = otf.metadata?.title || 'Untitled';
            setEditingLayout(true);
            editor = new OTFEditor({
                container: $('editor-host'),
                otf,
                trackId: otf.tracks[0]?.id,
                // The host owns the height; the tab scrolls inside the editor
                fillHeight: true,
                onChange: (doc) => saveDraft(doc, target),
            });
        }

        // ── Import a .tef file: parse client-side → open in the editor ──
        function showImportError(msg) {
            const el = $('import-error');
            el.textContent = msg;
            el.classList.remove('hidden');
        }

        async function importTefFile(file) {
            $('import-error').classList.add('hidden');
            if (!file) return;
            if (!/\.tef$/i.test(file.name)) {
                showImportError(`"${file.name}" is not a .tef file.`);
                return;
            }
            try {
                const bytes = new Uint8Array(await file.arrayBuffer());
                const otf = parseTef(bytes, file.name);   // the JS TEF→OTF pipeline
                const hasNotes = Object.values(otf.notation || {})
                    .some(measures => measures.length > 0);
                if (!hasNotes) {
                    showImportError(
                        "We couldn't read any notes from this tab file. If it opens "
                        + 'in TablEdit, please report it and we\'ll add support.');
                    return;
                }
                saveDraft(otf, target);
                openEditor(otf);
            } catch (err) {
                // Keep this format-agnostic — users shouldn't need to care which
                // TablEdit file variant they have.
                if (err instanceof TefVersionError) {
                    showImportError(
                        "This tab file uses a variant we can't read yet. Most .tef "
                        + "files work — please report this one and we'll add support.");
                } else {
                    showImportError(`Could not read that tab file: ${err.message}`);
                }
            }
        }

        const importZone = $('import-zone');
        const importInput = $('import-file');
        importZone.addEventListener('click', () => importInput.click());
        importZone.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); importInput.click(); }
        });
        importInput.addEventListener('change', () => {
            importTefFile(importInput.files[0]);
            importInput.value = '';   // allow re-picking the same file
        });
        ['dragenter', 'dragover'].forEach(evt =>
            importZone.addEventListener(evt, (e) => {
                e.preventDefault();
                importZone.classList.add('dragover');
            }));
        ['dragleave', 'drop'].forEach(evt =>
            importZone.addEventListener(evt, (e) => {
                e.preventDefault();
                importZone.classList.remove('dragover');
            }));
        importZone.addEventListener('drop', (e) => {
            const file = e.dataTransfer?.files?.[0];
            if (file) importTefFile(file);
        });

        $('create-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const instruments = [...document.querySelectorAll('#f-instruments input:checked')]
                .map(cb => cb.value);
            const otf = buildNewTab({
                title: $('f-title').value,
                instruments,
                timeSignature: $('f-ts').value,
                tempo: $('f-tempo').value,
                measures: $('f-measures').value,
            });
            saveDraft(otf, target);
            openEditor(otf);
        });

        $('btn-download').addEventListener('click', () => editor?.download());
        $('btn-submit').addEventListener('click', async () => {
            if (!editor) return;
            const status = $('submit-status');
            status.textContent = 'Submitting…';
            try {
                const doc = editor.save();
                // Login gate at the action (Phase 2a): everything up to
                // here — including Download — stays open to everyone.
                // submitNewTab picks the corpus instrument name and passes
                // the target work through as workId.
                const result = await submitNewTab(doc, target);
                // No review gate any more: the tab is LIVE the moment
                // submitNewTab resolves — its row is in the overlay and the
                // work page renders it from there. The only thing left to
                // report is the durable half, and `synced: false` is a retry
                // the reconciler owns, not a failure. DOM construction, not
                // innerHTML: the work id comes back from a network round trip.
                status.textContent = result?.synced === false
                    ? 'Saved and live — syncing to the songbook shortly. '
                    : 'Submitted — your tab is live now. ';
                const link = document.createElement('a');
                link.href = `index.html#work/${encodeURIComponent(result.workId)}`;
                link.textContent = 'View it';
                status.append(link);
                clearDraft();
            } catch (e) {
                status.textContent = `Failed: ${e.message}`;
            }
        });
        $('btn-new').addEventListener('click', () => {
            if (!confirm('Discard this tab and start over?')) return;
            clearDraft();
            editor?.destroy();
            editor = null;
            setEditingLayout(false);
            $('editor-wrap').classList.add('hidden');
            $('create-form').classList.remove('hidden');
            $('import-zone').classList.remove('hidden');
            document.querySelector('.or-sep')?.classList.remove('hidden');
            $('import-error').classList.add('hidden');
        });

        // Draft restore
        const draft = loadDraft();
        if (draft) {
            $('draft-when').textContent = new Date(draft.savedAt).toLocaleString();
            $('draft-banner').classList.remove('hidden');
            $('draft-resume').addEventListener('click', () => {
                // Restore the target too — a sign-in round trip strips the
                // query string, so the draft is where it survives.
                if (!target.workId && draft.target?.workId) {
                    target = draft.target;
                    applyTarget();
                }
                openEditor(draft.otf);
            });
            $('draft-discard').addEventListener('click', () => {
                clearDraft();
                $('draft-banner').classList.add('hidden');
            });
        }
    </script>
</body>
</html>
