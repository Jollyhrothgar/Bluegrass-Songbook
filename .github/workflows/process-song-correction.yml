name: Process Song Correction

on:
  issues:
    types: [labeled]

# Group per (workflow, issue). All three content workflows trigger on every
# `labeled` event and the job-level `if` filters them AFTERWARDS -- concurrency
# is evaluated at the workflow-run level, before any job's `if`, so a run that
# will skip still claims the group. With one shared group a SINGLE label event
# started three runs, one won, one queued, and the third evicted the queued one
# (GitHub keeps only one pending run per group). That is what silently dropped
# submissions #208 and #209; batching several issues was never required.
# Same issue + same workflow still serialises, which is the part that matters.
# Cross-run push races are handled by the rebase-retry push below.
concurrency:
  group: content-processing-correction-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  process-correction:
    # Only run when 'approved' label is added to an issue with 'song-correction' label
    if: github.event.label.name == 'approved' && contains(github.event.issue.labels.*.name, 'song-correction')
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Process correction
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: uv run python scripts/lib/process_correction.py

      - name: Rebuild search index
        run: uv run python scripts/lib/build_works_index.py --skip-fuzzy

      - name: Commit and push
        env:
          # Issue titles are attacker-controlled: anyone can open an issue. Never
          # interpolate them into the script with ${{ }} — that substitutes text
          # before the shell parses it, so a title containing a quote escapes the
          # string and runs as code. Passed through env and quoted, it stays data.
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sources/*/parsed/
          git add sources/*/protected.txt
          git add works/
          git diff --staged --quiet || \
            git commit -m "Apply song correction from #${ISSUE_NUMBER}" -m "$ISSUE_TITLE"

          # Retry push with rebase in case of concurrent pushes.
          # Must fail loudly: falling out of the loop used to exit 0, so a
          # commit that never reached the remote looked like a success.
          pushed=0
          for i in 1 2 3; do
            if git push; then pushed=1; break; fi
            echo "Push failed, attempt $i - pulling and retrying..."
            git pull --rebase
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::Push failed after 3 attempts - correction was NOT committed"
            exit 1
          fi

      - name: Close issue with comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Read the song ID that was corrected
            let songId = 'unknown';
            try {
              songId = fs.readFileSync('/tmp/corrected_song_id.txt', 'utf8').trim();
            } catch (e) {
              console.log('Could not read song ID');
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ **Song correction applied!**\n\nFile: \`sources/classic-country/parsed/${songId}.pro\`\n\nThe song has been updated and added to the protected list to prevent parser overwrites.\n\nThank you for your contribution!`
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
