name: Deploy Supabase Functions

# Phase 1a of the contribution pipeline (docs/plans/contribution-pipeline.md,
# issue #217). THIS workflow is what deploys supabase/functions/ — it has been
# live since 2026-08-16, so production is what last merged to main, not what
# someone last pushed from a laptop. The pre-CI baseline hand-deploy the
# original header warned about happened before that first run; it is history.
#
# What is deployed: every directory under supabase/functions/ except _shared
# (auto-commit-song, cleanup-pending, create-flag-issue, create-song-request,
# create-superuser-request, reconcile-pending). Count it rather than trusting
# this list — `ls supabase/functions/` and `supabase functions list`. They
# agreed on 2026-08-19, after create-tab-pr and create-song-issue were
# deleted from both the repo and production.
#
# Deleting a function from the repo does NOT delete it from production —
# `supabase functions deploy` only pushes what it finds. Removing one means
# `supabase functions delete <name> --project-ref ofmqlrnyldlmvggihogt` by
# hand, or it keeps serving the last version that was pushed.
#
# The SUPABASE_ACCESS_TOKEN secret (Settings > Secrets and variables >
# Actions) is required and has no fallback: without it the deploy step fails
# loudly rather than skipping.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      # The Deno test harness for those functions (config + lockfile).
      - 'supabase/deno.json'
      - 'supabase/deno.lock'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:
    inputs:
      function:
        description: 'Function name to deploy (leave blank to deploy all)'
        required: false
        type: string

concurrency:
  group: deploy-functions
  cancel-in-progress: false

env:
  # Public — this is the same project ref shipped in the frontend's Supabase
  # client config, not a secret.
  SUPABASE_PROJECT_ID: ofmqlrnyldlmvggihogt

jobs:
  # Nothing reaches production without the change gate's tests passing.
  #
  # `build.yml` already runs these on every push and PR to main, but this
  # workflow deploys on its own trigger and would otherwise ship a broken
  # classifyChange the moment it merged — the two workflows race, and losing
  # that race means a live authorization bug. So the gate is repeated here,
  # where it is the thing standing between main and the edge runtime. It costs
  # about twenty seconds.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check edge functions
        working-directory: supabase
        run: deno task check

      - name: Run edge function tests
        working-directory: supabase
        run: deno task test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy edge function(s)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # Mapped via env rather than interpolated into the script so a
          # crafted dispatch input can't inject shell.
          FN_INPUT: ${{ inputs.function }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set"
            exit 1
          fi

          fn="$FN_INPUT"
          if [ -n "$fn" ]; then
            echo "Deploying single function: $fn"
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_ID"
          else
            echo "Deploying all functions"
            supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
          fi
