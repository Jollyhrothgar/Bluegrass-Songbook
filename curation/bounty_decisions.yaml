# Bounty board adjudication ledger — song-identity decisions
#
# Which catalogue songs denote a work the songbook already has. Keyed on
# `catalogue_id` from docs/data/bluegrass_catalogue.json, NOT on a raw title:
# titles shift between research runs, and they did — the first cut of this
# ledger pinned board titles carrying Strum Machine arrangement suffixes, and
# every one of them detached the moment the catalogue folded those away.
#
# Why this file exists: the wanted side carries only a title. Lyrics exist on
# the corpus side only, and artist overlap is circular (MusicBrainz keys
# recordings by title, so the fragmentation we are fixing guarantees disjoint
# artist sets). Identity here is referential — which strings denote the same
# musical work — so neither string distance nor title embeddings can decide it.
# See sources/bounty-hunt/CLEANUP-PLAN.md for the evidence.
#
# Adjudicated 2026-08-15 against index 2,458 / archive 16,764: all 110 wanted
# entries that had any candidate. The other 586 have no corpus match.
#
# Sections:
#   covered      — the wanted song IS this work; drop from the board
#   distinct     — scores close, different song; keep on the board
#   uncertain    — needs someone who knows which tune the source meant
#   not_a_song   — catalogue artifact, never a bounty
#   keep         — real repertoire the catalogue cannot vouch for (no MB
#                  coverage / below the score cut). Carried onto the board
#                  verbatim by build_wanted.py, the way registry.yaml `keep:`
#                  rescues pruned works. Row data lives here because the
#                  catalogue has no row to take it from.
#   intra_dupes  — same song listed twice under arrangement-variant titles
#
# `chords: 0` on a covered work means the page exists but is lyrics-only —
# route it to "Needs Chords", not "Missing Jam Standards".
# `archived: true` means the work is pruned from search; these are the
# promote candidates for the Dungeon flow.

